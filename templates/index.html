<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-AI Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/documents.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Multi-AI Chat</h1>
            <p class="subtitle">Общайтесь с несколькими ИИ одновременно</p>
            <nav class="nav-links">
                <a href="/" class="active">Чат с ИИ</a>
                <a href="/documents">Документы</a>
                <a href="/employees">Личные дела</a>
            </nav>
        </header>

        <div class="provider-selector">
            <h3>Выберите модели:</h3>
            <div class="providers" id="providers">
                {% for key, info in providers.items() %}
                <div class="provider-group {% if not info.configured %}disabled{% endif %}">
                    <div class="provider-name">
                        {{ info.name }}
                        {% if not info.configured %}
                        <span class="badge">нет ключа</span>
                        {% endif %}
                    </div>
                    {% for model in info.models %}
                    <label class="model-option">
                        <input type="checkbox"
                               value="{{ key }}:{{ model }}"
                               {% if not info.configured %}disabled{% endif %}>
                        <span>{{ model }}</span>
                    </label>
                    {% endfor %}
                </div>
                {% endfor %}
            </div>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="chat-messages" id="chatMessages"></div>
        </div>

        <div class="input-area">
            <textarea id="messageInput"
                      placeholder="Введите сообщение..."
                      rows="2"></textarea>
            <button id="sendBtn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
