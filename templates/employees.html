<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личные дела — Multi-AI Chat</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/documents.css">
    <link rel="stylesheet" href="/static/employees.css">
</head>
<body>
    <div class="app" style="height: auto; min-height: 100vh;">
        <header>
            <h1>Личные дела сотрудников</h1>
            <p class="subtitle">Управление персоналом и документами</p>
            <nav class="nav-links">
                <a href="/">Чат с ИИ</a>
                <a href="/documents">Документы</a>
                <a href="/employees" class="active">Личные дела</a>
            </nav>
        </header>

        <div class="employees-container">
            <!-- Toolbar -->
            <div class="toolbar">
                <input type="text" id="searchInput" class="search-input"
                       placeholder="Поиск по ФИО, должности, отделу..."
                       oninput="searchEmployees()">
                <button class="btn-primary btn-add" onclick="showAddModal()">
                    + Добавить сотрудника
                </button>
            </div>

            <!-- Employees list -->
            <div class="employees-list" id="employeesList">
                <div class="empty-state" id="emptyState">
                    <p>Нет сотрудников. Нажмите «Добавить сотрудника» для начала работы.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div class="modal-overlay" id="employeeModal" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Новый сотрудник</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="employeeForm" onsubmit="saveEmployee(event)">
                <input type="hidden" id="editEmployeeId" value="">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Фамилия *</label>
                        <input type="text" id="formSurname" required>
                    </div>
                    <div class="form-group">
                        <label>Имя *</label>
                        <input type="text" id="formName" required>
                    </div>
                    <div class="form-group">
                        <label>Отчество</label>
                        <input type="text" id="formPatronymic">
                    </div>
                    <div class="form-group">
                        <label>Дата рождения</label>
                        <input type="text" id="formBirthDate" placeholder="дд.мм.гггг">
                    </div>
                    <div class="form-group">
                        <label>Пол</label>
                        <select id="formGender">
                            <option value="">—</option>
                            <option value="Мужской">Мужской</option>
                            <option value="Женский">Женский</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Телефон</label>
                        <input type="text" id="formPhone">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="formEmail">
                    </div>
                    <div class="form-group">
                        <label>Отдел</label>
                        <input type="text" id="formDepartment">
                    </div>
                    <div class="form-group">
                        <label>Должность</label>
                        <input type="text" id="formPosition">
                    </div>
                    <div class="form-group">
                        <label>Дата приёма</label>
                        <input type="text" id="formHireDate" placeholder="дд.мм.гггг">
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Заметки</label>
                    <textarea id="formNotes" rows="2"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/employees.js"></script>
</body>
</html>
